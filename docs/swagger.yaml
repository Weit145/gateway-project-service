basePath: /
definitions:
  dto.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 32
        minLength: 6
        type: string
      old_password:
        maxLength: 32
        minLength: 6
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.ConfirmEmailRequest:
    properties:
      token:
        type: string
      userId:
        type: string
    required:
    - token
    - userId
    type: object
  dto.Health:
    properties:
      db:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  dto.HealthResponse:
    properties:
      services:
        items:
          $ref: '#/definitions/dto.Health'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 32
        minLength: 4
        type: string
      password:
        maxLength: 32
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.PasswordConfirmRequest:
    properties:
      password:
        maxLength: 32
        minLength: 6
        type: string
      token:
        type: string
      userId:
        type: string
    required:
    - password
    - token
    - userId
    type: object
  dto.PasswordRequest:
    properties:
      email:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - email
    type: object
  dto.RegisterRequest:
    properties:
      email:
        maxLength: 32
        minLength: 4
        type: string
      name:
        maxLength: 32
        minLength: 4
        type: string
      password:
        maxLength: 32
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.RegisterResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.RepeatEmailRequest:
    properties:
      email:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - email
    type: object
  dto.Response:
    properties:
      error:
        type: string
      status:
        type: string
    type: object
  dto.User:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: HTTP gateway for startup services.
  title: Gateway Startup API
  version: "1.0"
paths:
  /_health:
    get:
      description: Checks gateway and auth service availability.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Check health
      tags:
      - health
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the current user's password. Requires "Bearer <access_token>"
        in Authorization.
      parameters:
      - description: Change password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/confirm-email:
    post:
      consumes:
      - application/json
      description: Confirms a user email by verification token and returns an access
        token. Refresh token is set in an HttpOnly cookie.
      parameters:
      - description: Confirm email request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ConfirmEmailRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              description: refresh_token cookie
              type: string
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Confirm user email
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns an access token. Refresh token
        is set in an HttpOnly cookie.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              description: refresh_token cookie
              type: string
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Requires "Bearer <access_token>" in Authorization and revokes the
        refresh_token from the HttpOnly cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Clears the refresh_token cookie
              type: string
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: Confirms a password reset by token and sets a new password.
      parameters:
      - description: Password reset confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PasswordConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Confirm password reset
      tags:
      - auth
  /auth/password-reset/request:
    post:
      consumes:
      - application/json
      description: Sends a password reset request to the user's email.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Request password reset
      tags:
      - auth
  /auth/refresh-token:
    post:
      description: Validates the refresh_token HttpOnly cookie and returns a new access
        token.
      parameters:
      - description: refresh_token=<token>
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user and sends an email verification request.
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Register user
      tags:
      - auth
  /auth/repeat-email:
    post:
      consumes:
      - application/json
      description: Sends a new email verification token to an existing unverified
        user.
      parameters:
      - description: Repeat email verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RepeatEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Repeat email verification
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
