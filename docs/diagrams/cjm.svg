<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1446px;height:227px;background:#FFFFFF;" width="1446px" height="227px" viewBox="0 0 1446 227" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="571.115" y="24.966" fill="#000" font-size="14" textLength="296.771" font-weight="700">Gateway — CJM: HTTP-путь пользователя</text></g><!--entity request--><g class="entity" data-qualified-name="request" id="ent0001" data-source-line="6"><rect x="50" y="52.068" width="170.863" height="96.272" fill="#E8F3FF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="60" y="77.034" fill="#000" font-size="14" textLength="143.331">1. Запросить письмо</text><text x="60" y="96.102" fill="#000" font-size="14" textLength="150.863">POST /register/request</text><text x="60" y="115.17" fill="#000" font-size="14" textLength="84.672">email → auth</text><text x="60" y="134.238" fill="#000" font-size="14" textLength="63.56">Ответ: ok</text></g><!--entity letter--><g class="entity" data-qualified-name="letter" id="ent0002" data-source-line="7"><rect x="301" y="52.068" width="223.321" height="96.272" fill="#FFF2D7" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="311" y="77.034" fill="#000" font-size="14" textLength="137.227">2. Получить письмо</text><text x="311" y="96.102" fill="#000" font-size="14" textLength="109.018">Ссылка из email</text><text x="311" y="115.17" fill="#000" font-size="14" textLength="99.148">Токен и userId</text><text x="311" y="134.238" fill="#000" font-size="14" textLength="203.321">Повтор: /register/repeat-email</text></g><!--entity confirm--><g class="entity" data-qualified-name="confirm" id="ent0003" data-source-line="8"><rect x="560" y="61.568" width="238.259" height="77.204" fill="#FFF2D7" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="570" y="86.534" fill="#000" font-size="14" textLength="145.291">3. Подтвердить email</text><text x="570" y="105.602" fill="#000" font-size="14" textLength="151.409">POST /register/confirm</text><text x="570" y="124.67" fill="#000" font-size="14" textLength="218.259">Ответ: временный access_token</text></g><!--entity complete--><g class="entity" data-qualified-name="complete" id="ent0004" data-source-line="9"><rect x="848.5" y="52.068" width="211.911" height="96.272" fill="#E3F5E8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="858.5" y="77.034" fill="#000" font-size="14" textLength="116.172">4. Задать пароль</text><text x="858.5" y="96.102" fill="#000" font-size="14" textLength="161.615">POST /register/complete</text><text x="858.5" y="115.17" fill="#000" font-size="14" textLength="160.607">Bearer: временный JWT</text><text x="858.5" y="134.238" fill="#000" font-size="14" textLength="191.911">Ответ: access_token + cookie</text></g><!--entity session--><g class="entity" data-qualified-name="session" id="ent0005" data-source-line="10"><rect x="1155" y="52.068" width="231.189" height="96.272" fill="#E3F5E8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1165" y="77.034" fill="#000" font-size="14" textLength="162.217">5. Использовать доступ</text><text x="1165" y="96.102" fill="#000" font-size="14" textLength="211.189">/auth/login, /auth/refresh-token</text><text x="1165" y="115.17" fill="#000" font-size="14" textLength="83.496">/auth/logout</text><text x="1165" y="134.238" fill="#000" font-size="14" textLength="143.457">Cookie: refresh_token</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="18"><path d="M6,166.568 L6,211.98 A0,0 0 0 0 6,211.98 L264.601,211.98 A0,0 0 0 0 264.601,211.98 L264.601,176.568 L254.601,166.568 L139.5,166.568 L135.5,148.313 L131.5,166.568 L6,166.568 A0,0 0 0 0 6,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M254.601,166.568 L254.601,176.568 L264.601,176.568 L254.601,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="185.465" fill="#000" font-size="13" textLength="216.684">Email ограничен Redis rate limiter.</text><text x="12" y="203.171" fill="#000" font-size="13" textLength="237.601">Повторный запрос также ограничен.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="22"><path d="M834,166.568 L834,211.98 A0,0 0 0 0 834,211.98 L1074.57,211.98 A0,0 0 0 0 1074.57,211.98 L1074.57,176.568 L1064.57,166.568 L958.5,166.568 L954.5,148.313 L950.5,166.568 L834,166.568 A0,0 0 0 0 834,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1064.57,166.568 L1064.57,176.568 L1074.57,176.568 L1064.57,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="840" y="185.465" fill="#000" font-size="13" textLength="219.57">refresh_token хранится в HttpOnly,</text><text x="840" y="203.171" fill="#000" font-size="13" textLength="190.125">Secure, SameSite=Strict cookie.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="26"><path d="M1111,166.568 L1111,211.98 A0,0 0 0 0 1111,211.98 L1430.116,211.98 A0,0 0 0 0 1430.116,211.98 L1430.116,176.568 L1420.116,166.568 L1274.5,166.568 L1270.5,148.313 L1266.5,166.568 L1111,166.568 A0,0 0 0 0 1111,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1420.116,166.568 L1420.116,176.568 L1430.116,176.568 L1420.116,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1117" y="185.465" fill="#000" font-size="13" textLength="298.116">Забытый пароль: /auth/password-reset/request</text><text x="1117" y="203.171" fill="#000" font-size="13" textLength="199.602">и /auth/password-reset/confirm.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="300.683,100.068,291.683,96.068,295.683,100.068,291.683,104.068,300.683,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M221.253,100.068 C246.346,100.068 269.201,100.068 295.683,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="559.705,100.068,550.705,96.068,554.705,100.068,550.705,104.068,559.705,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M524.139,100.068 C535.889,100.068 542.872,100.068 554.705,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="848.279,100.068,839.279,96.068,843.279,100.068,839.279,104.068,848.279,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M798.37,100.068 C814.973,100.068 826.943,100.068 843.279,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="1154.913,100.068,1145.913,96.068,1149.913,100.068,1145.913,104.068,1154.913,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1060.931,100.068 C1091.13,100.068 1119.192,100.068 1149.913,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><?plantuml-src TPFVJXD15CRlzocES2cb4III9deXiYA9WTWctZGnOtlQJhexKsUc8ToL4lG24X9ZebSQVOAAHIf_oYlClW9Fufdjj6onNdLxzknyl_ETR-wr5Al732AsAzi6T8o62HOORYA4vypW3jk5cyudMDjyMO2DKcaxPw-J_QIR786zjaDxaHpPC_eziRsaQq_f_t4GOSs0aQ1ulM6WoXLM39SYq4qkMaon67I3LUKE5tMeiKXZ4BWM9keaElTW4UndsoEPZXqcUtOm5XiaUoHsQOTbiRrLB45UOPrhWueUthLHcxB0cF48Rjv_1DOsZRAmNmdgn9uctGB8vXmm3RuNvjTNm-Kmp2elaVAtTARzvCDCNVkTdW_jXJstFR03UmQf8htuGT-Tq_nNL8QsHlMYIbLtsWa