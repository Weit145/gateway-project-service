<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:977px;height:494px;background:#FFFFFF;" width="977px" height="494px" viewBox="0 0 977 494" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="322.874" y="24.966" fill="#000" font-size="14" textLength="324.253" font-weight="700">Gateway — Redis: схема ключей rate limiting</text></g><!--cluster redis--><g class="cluster" data-qualified-name="redis" id="ent0004" data-source-line="9"><path d="M614,151.568 C614,141.568 747,141.568 747,141.568 C747,141.568 880,141.568 880,151.568 L880,460.568 C880,470.568 747,470.568 747,470.568 C747,470.568 614,470.568 614,460.568 L614,151.568" style="stroke:#181818;stroke-width:1;" fill="none"/><path d="M614,151.568 C614,161.568 747,161.568 747,161.568 C747,161.568 880,161.568 880,151.568" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="728.198" y="178.534" fill="#000" font-size="14" textLength="37.604" font-weight="700">Redis</text></g><!--entity auth--><g class="entity" data-qualified-name="auth" id="ent0001" data-source-line="6"><rect x="66" y="212.068" width="169.043" height="39.068" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="76" y="237.034" fill="#000" font-size="14" textLength="149.043">HTTP-запросы /auth/*</text></g><!--entity emailroutes--><g class="entity" data-qualified-name="emailroutes" id="ent0002" data-source-line="7"><rect x="6" y="269.068" width="288.911" height="77.204" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16" y="294.034" fill="#000" font-size="14" textLength="102.97">Запросы email:</text><text x="16" y="313.102" fill="#000" font-size="14" textLength="268.911">/register/request, /register/repeat-email,</text><text x="16" y="332.17" fill="#000" font-size="14" textLength="198.015">/auth/password-reset/request</text></g><!--entity protected--><g class="entity" data-qualified-name="protected" id="ent0003" data-source-line="8"><rect x="16.5" y="364.568" width="268.149" height="58.136" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="26.5" y="389.534" fill="#000" font-size="14" textLength="170.785">Защищённые операции:</text><text x="26.5" y="408.602" fill="#000" font-size="14" textLength="248.149">/auth/logout, /auth/change-password</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="20"><path d="M533,44.068 L533,124.892 L960.965,124.892 L960.965,54.068 L950.965,44.068 L533,44.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M950.965,44.068 L950.965,54.068 L960.965,54.068 L950.965,44.068" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="539" y="62.965" fill="#000" font-size="13" textLength="251.186">Gateway не создаёт таблиц PostgreSQL.</text><text x="539" y="80.671" fill="#000" font-size="13" textLength="362.349">Состояние ключей и срок жизни управляются redis_rate.</text><text x="539" y="98.377" fill="#000" font-size="13" textLength="345.371">Реализация маскирует email: первые 5 символов + '*'.</text><text x="539" y="116.083" fill="#000" font-size="13" textLength="406.965">Схема PostgreSQL находится в auth-startup/docs/database.puml.</text></g><!--entity ip--><g class="entity" data-qualified-name="redis.ip" id="ent0005" data-source-line="10"><rect x="653.5" y="202.568" width="186.781" height="58.136" fill="#D5F5D5" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="663.5" y="227.534" fill="#000" font-size="14" textLength="109.746">rate_limit:ip:&lt;ip></text><text x="663.5" y="246.602" fill="#000" font-size="14" textLength="166.781">redis_rate: 3 запроса/сек</text></g><!--entity email--><g class="entity" data-qualified-name="redis.email" id="ent0006" data-source-line="11"><rect x="630" y="278.568" width="233.569" height="58.136" fill="#D5F5D5" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="640" y="303.534" fill="#000" font-size="14" textLength="213.569">rate_limit:email:&lt;masked-email></text><text x="640" y="322.602" fill="#000" font-size="14" textLength="173.123">redis_rate: 2 запроса/мин</text></g><!--entity user--><g class="entity" data-qualified-name="redis.user" id="ent0007" data-source-line="12"><rect x="653.5" y="354.568" width="186.781" height="58.136" fill="#D5F5D5" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="663.5" y="379.534" fill="#000" font-size="14" textLength="159.837">rate_limit:user:id:&lt;uuid></text><text x="663.5" y="398.602" fill="#000" font-size="14" textLength="166.781">redis_rate: 3 запроса/сек</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk8" data-link-type="dependency"><polygon points="653.114,231.568,644.114,227.568,648.114,231.568,644.114,235.568,653.114,231.568" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M235.102,231.568 C345.278,231.568 533.488,231.568 648.114,231.568" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="323" y="226.465" fill="#000" font-size="13" textLength="182.585">CheckIPRateLimit middleware</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk9" data-link-type="dependency"><polygon points="629.655,307.568,620.655,303.568,624.655,307.568,620.655,311.568,629.655,307.568" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M295.033,307.568 C397.6,307.568 528.855,307.568 624.655,307.568" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="348.5" y="302.465" fill="#000" font-size="13" textLength="131.898">LimiterEmail use case</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk10" data-link-type="dependency"><polygon 